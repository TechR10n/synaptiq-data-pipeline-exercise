<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:988px;height:354px;background:#FFFFFF;" width="988px" height="354px" viewBox="0 0 988 354" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster m1--><g class="cluster" data-qualified-name="m1" id="ent0001" data-source-line="7"><rect x="7" y="103" width="275.2" height="237" fill="#FFF" style="stroke:#52525B;stroke-width:1;" rx="3" ry="3"/><text x="18.6" y="116.472" fill="#18181B" font-size="12" textLength="252" font-weight="700" font-family="Berkeley Mono, monospace">1. Move 1 · Raw CSV -> Bronze Delta</text><text x="72.6" y="130.872" fill="#18181B" font-size="12" textLength="144" font-weight="700" font-family="Berkeley Mono, monospace">(Permissive Landing)</text></g><!--cluster m2--><g class="cluster" data-qualified-name="m2" id="ent0004" data-source-line="12"><rect x="306.2" y="7" width="354.4" height="333" fill="#FFF" style="stroke:#52525B;stroke-width:1;" rx="3" ry="3"/><text x="361" y="20.472" fill="#18181B" font-size="12" textLength="244.8" font-weight="700" font-family="Berkeley Mono, monospace">2. Move 2 · Bronze -> Silver Delta</text><text x="361" y="34.872" fill="#18181B" font-size="12" textLength="244.8" font-weight="700" font-family="Berkeley Mono, monospace">(Functional Clean + Parquet Steps)</text></g><!--cluster m3--><g class="cluster" data-qualified-name="m3" id="ent0008" data-source-line="18"><rect x="684.6" y="22" width="289.6" height="318" fill="#FFF" style="stroke:#52525B;stroke-width:1;" rx="3" ry="3"/><text x="714.2" y="35.472" fill="#18181B" font-size="12" textLength="230.4" font-weight="700" font-family="Berkeley Mono, monospace">3. Move 3 · Silver -> Gold Delta</text><text x="725" y="49.872" fill="#18181B" font-size="12" textLength="208.8" font-weight="700" font-family="Berkeley Mono, monospace">(Catalog Join &amp; Aggregations)</text></g><!--entity raw--><g class="entity" data-qualified-name="m1.raw" id="ent0002" data-source-line="8"><rect x="23" y="246.2" width="243.2" height="77.6" fill="#F1F5F9" style="stroke:#64748B;stroke-width:1.2;" rx="3" ry="3"/><text x="47.4" y="267.672" fill="#334155" font-size="12" textLength="194.4" font-weight="700" font-family="Berkeley Mono, monospace">Daily Order Drops + Catalog</text><text x="33" y="282.072" fill="#334155" font-size="12" textLength="223.2" font-family="Berkeley Mono, monospace">orders_2024-01-01.csv (12 rows)</text><text x="33" y="296.472" fill="#334155" font-size="12" textLength="223.2" font-family="Berkeley Mono, monospace">orders_2024-01-02.csv (12 rows)</text><text x="65.4" y="310.872" fill="#334155" font-size="12" textLength="158.4" font-family="Berkeley Mono, monospace">products.csv (10 SKUs)</text></g><!--entity brz--><g class="entity" data-qualified-name="m1.brz" id="ent0003" data-source-line="9"><rect x="23" y="150.2" width="243.2" height="77.6" fill="#EFF6FF" style="stroke:#1D4ED8;stroke-width:1.6;" rx="3" ry="3"/><text x="33" y="171.672" fill="#0F172A" font-size="12" textLength="223.2" font-weight="700" font-family="Berkeley Mono, monospace">bronze/orders &amp; bronze/products</text><text x="43.8" y="186.072" fill="#0F172A" font-size="12" textLength="201.6" font-family="Berkeley Mono, monospace">PERMISSIVE + _corrupt_record</text><text x="43.8" y="200.472" fill="#0F172A" font-size="12" textLength="201.6" font-family="Berkeley Mono, monospace">drop_date dynamic partitions</text><text x="47.4" y="214.872" fill="#0F172A" font-size="12" textLength="194.4" font-family="Berkeley Mono, monospace">24 raw orders + 10 products</text></g><!--entity p12--><g class="entity" data-qualified-name="m2.p12" id="ent0005" data-source-line="13"><rect x="322.2" y="246.2" width="322.4" height="77.6" fill="#EFF6FF" style="stroke:#1D4ED8;stroke-width:1.6;" rx="3" ry="3"/><text x="382.6" y="267.672" fill="#0F172A" font-size="12" textLength="201.6" font-weight="700" font-family="Berkeley Mono, monospace">Step 1-2 Parquet Checkpoints</text><text x="371.8" y="282.072" fill="#0F172A" font-size="12" textLength="223.2" font-family="Berkeley Mono, monospace">01_orders_parsed_fields.parquet</text><text x="386.2" y="296.472" fill="#0F172A" font-size="12" textLength="194.4" font-family="Berkeley Mono, monospace">02_orders_row_traps.parquet</text><text x="332.2" y="310.872" fill="#0F172A" font-size="12" textLength="302.4" font-family="Berkeley Mono, monospace">UTC dates · [$,] strip · EXTRA_FLAG rescue</text></g><!--entity p3--><g class="entity" data-qualified-name="m2.p3" id="ent0006" data-source-line="14"><rect x="343.8" y="150.2" width="279.2" height="77.6" fill="#FFFBEB" style="stroke:#D97706;stroke-width:1.6;" rx="3" ry="3"/><text x="375.4" y="171.672" fill="#78350F" font-size="12" textLength="216" font-weight="700" font-family="Berkeley Mono, monospace">Step 3 Window CDC + Superseded</text><text x="364.6" y="186.072" fill="#78350F" font-size="12" textLength="237.6" font-family="Berkeley Mono, monospace">03_orders_reconciled.parquet (22)</text><text x="353.8" y="200.472" fill="#78350F" font-size="12" textLength="259.2" font-family="Berkeley Mono, monospace">03_orders_cdc_superseded.parquet (2)</text><text x="382.6" y="214.872" fill="#78350F" font-size="12" textLength="201.6" font-family="Berkeley Mono, monospace">O1002 dedup · O1003 qty 5->6</text></g><!--entity slv--><g class="entity" data-qualified-name="m2.slv" id="ent0007" data-source-line="15"><rect x="347.4" y="54.2" width="272" height="77.6" fill="#F0FDF4" style="stroke:#15803D;stroke-width:1.6;" rx="3" ry="3"/><text x="371.8" y="75.672" fill="#14532D" font-size="12" textLength="223.2" font-weight="700" font-family="Berkeley Mono, monospace">silver/orders &amp; silver/products</text><text x="361" y="90.072" fill="#14532D" font-size="12" textLength="244.8" font-family="Berkeley Mono, monospace">Delta MERGE (src.drop_date >= tgt)</text><text x="357.4" y="104.472" fill="#14532D" font-size="12" textLength="252" font-family="Berkeley Mono, monospace">22 canonical orders · 10 clean SKUs</text><text x="425.8" y="118.872" fill="#14532D" font-size="12" textLength="115.2" font-family="Berkeley Mono, monospace">0 loops · 0 UDFs</text></g><!--entity fct--><g class="entity" data-qualified-name="m3.fct" id="ent0009" data-source-line="19"><rect x="704.2" y="246.2" width="250.4" height="77.6" fill="#EFF6FF" style="stroke:#1D4ED8;stroke-width:1.6;" rx="3" ry="3"/><text x="725" y="267.672" fill="#0F172A" font-size="12" textLength="208.8" font-weight="700" font-family="Berkeley Mono, monospace">04_joined_order_facts.parquet</text><text x="739.4" y="282.072" fill="#0F172A" font-size="12" textLength="180" font-family="Berkeley Mono, monospace">LEFT JOIN silver/products</text><text x="714.2" y="296.472" fill="#0F172A" font-size="12" textLength="230.4" font-family="Berkeley Mono, monospace">COALESCE(unit_price, list_price)</text><text x="725" y="310.872" fill="#0F172A" font-size="12" textLength="208.8" font-family="Berkeley Mono, monospace">COALESCE(category, 'Unknown')</text></g><!--entity gld--><g class="entity" data-qualified-name="m3.gld" id="ent0010" data-source-line="20"><rect x="700.6" y="150.2" width="257.6" height="77.6" fill="#F0FDF4" style="stroke:#15803D;stroke-width:1.6;" rx="3" ry="3"/><text x="721.4" y="171.672" fill="#14532D" font-size="12" textLength="216" font-weight="700" font-family="Berkeley Mono, monospace">gold/daily_sales (Delta + CSV)</text><text x="710.6" y="186.072" fill="#14532D" font-size="12" textLength="237.6" font-family="Berkeley Mono, monospace">17 (date, category, region) cells</text><text x="728.6" y="200.472" fill="#14532D" font-size="12" textLength="201.6" font-family="Berkeley Mono, monospace">Dynamic order_date overwrite</text><text x="728.6" y="214.872" fill="#14532D" font-size="12" textLength="201.6" font-family="Berkeley Mono, monospace">Return-safe NULLIF AOV guard<