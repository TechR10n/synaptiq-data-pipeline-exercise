[project]
name = "synaptiq-data-pipeline"
version = "0.1.0"
description = "Functional PySpark daily retail sales pipeline with intermediate Parquet enrichment and forensic trap auditing"
readme = "NOTES.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "delta-spark>=4.0.0,<4.5.0",
    "pyspark>=4.0.0,<4.3.0",
]

[dependency-groups]
dev = [
    "pillow>=11.0.0",
    "pydocstyle>=6.3.0",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "python-pptx>=1.0.2",
    "ruff>=0.9.0",
]

[project.scripts]
synaptiq-pipeline = "synaptiq_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synaptiq_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=synaptiq_pipeline --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
